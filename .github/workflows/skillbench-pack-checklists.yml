name: SkillBench Eval Pack Checklists

on:
  pull_request:
    branches: [main]
    paths:
      - "examples/eval_packs/**/*.json"
      - "runtime/skillbench/cases/**"
      - "runtime/skillbench/cli.py"
      - ".github/workflows/skillbench-pack-checklists.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  eval-pack-checklists:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Build eval pack checklists
        id: eval_pack_checklists
        shell: bash
        run: |
          mkdir -p .skillbench/pack-checklists
          status=0
          shopt -s nullglob
          for pack in examples/eval_packs/*.json; do
            name="$(basename "${pack}" .json)"
            skillbench pack-checklist "${pack}" \
              --output ".skillbench/pack-checklists/${name}.md"
            set +e
            skillbench validate-cases "${pack}" \
              --json | tee ".skillbench/pack-checklists/${name}.validation.json"
            pack_status=${PIPESTATUS[0]}
            set -e
            if [ "${pack_status}" -ne 0 ]; then
              status=1
            fi
          done
          if [ -f examples/eval_packs/generic-skill-smoke.json ] && [ -f examples/eval_packs/generic-skill-release.json ]; then
            set +e
            skillbench pack-compare examples/eval_packs/generic-skill-smoke.json examples/eval_packs/generic-skill-release.json \
              --output .skillbench/pack-checklists/generic-skill-smoke-to-release-comparison.md
            compare_status=$?
            skillbench pack-compare examples/eval_packs/generic-skill-smoke.json examples/eval_packs/generic-skill-release.json \
              --json | tee .skillbench/pack-checklists/generic-skill-smoke-to-release-comparison.json
            compare_json_status=${PIPESTATUS[0]}
            set -e
            if [ "${compare_status}" -ne 0 ] || [ "${compare_json_status}" -ne 0 ]; then
              status=1
            fi
          fi
          skillbench pr-comment .skillbench/pack-checklists \
            --output .skillbench/pack-checklists/skillbench-pack-review-comment.md
          set +e
          skillbench pack-review-artifacts .skillbench/pack-checklists \
            --output .skillbench/pack-checklists/pack_review_ci_result.json \
            --junit .skillbench/pack-checklists/pack-review-junit.xml \
            --sarif .skillbench/pack-checklists/pack-review.sarif \
            --json | tee .skillbench/pack-checklists/pack_review_ci_result.output.json
          pack_review_artifacts_status=${PIPESTATUS[0]}
          set -e
          if [ "${pack_review_artifacts_status}" -ne 0 ]; then
            status=1
          fi
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload eval pack checklist artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-pack-checklists
          path: .skillbench/pack-checklists

      - name: Comment eval pack review summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "## SkillBench Eval Pack Review";
            const body = fs.readFileSync(".skillbench/pack-checklists/skillbench-pack-review-comment.md", "utf8");

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.data.find((comment) => comment.user?.type === "Bot" && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail when eval pack validation failed
        if: steps.eval_pack_checklists.outputs.status != '0'
        run: exit 1
