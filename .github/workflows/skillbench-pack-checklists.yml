name: SkillBench Eval Pack Checklists

on:
  pull_request:
    branches: [main]
    paths:
      - "examples/eval_packs/**/*.json"
      - "runtime/skillbench/cases/**"
      - "runtime/skillbench/cli.py"
      - ".github/workflows/skillbench-pack-checklists.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval-pack-checklists:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Build eval pack checklists
        id: eval_pack_checklists
        shell: bash
        run: |
          mkdir -p .skillbench/pack-checklists
          status=0
          shopt -s nullglob
          for pack in examples/eval_packs/*.json; do
            name="$(basename "${pack}" .json)"
            skillbench pack-checklist "${pack}" \
              --output ".skillbench/pack-checklists/${name}.md"
            set +e
            skillbench validate-cases "${pack}" \
              --json | tee ".skillbench/pack-checklists/${name}.validation.json"
            pack_status=${PIPESTATUS[0]}
            set -e
            if [ "${pack_status}" -ne 0 ]; then
              status=1
            fi
          done
          if [ -f examples/eval_packs/generic-skill-smoke.json ] && [ -f examples/eval_packs/generic-skill-release.json ]; then
            set +e
            skillbench pack-compare examples/eval_packs/generic-skill-smoke.json examples/eval_packs/generic-skill-release.json \
              --fail-on-removed-dimensions context_efficiency evidence_quality maintainability safety tooling_guidance trigger_clarity trigger_precision workflow_specificity \
              --fail-on-removed-types safety should-not-trigger should-trigger \
              --fail-on-removed-modes judge-only \
              --output .skillbench/pack-checklists/generic-skill-smoke-to-release-comparison.md
            compare_status=$?
            skillbench pack-compare examples/eval_packs/generic-skill-smoke.json examples/eval_packs/generic-skill-release.json \
              --fail-on-removed-dimensions context_efficiency evidence_quality maintainability safety tooling_guidance trigger_clarity trigger_precision workflow_specificity \
              --fail-on-removed-types safety should-not-trigger should-trigger \
              --fail-on-removed-modes judge-only \
              --json | tee .skillbench/pack-checklists/generic-skill-smoke-to-release-comparison.json
            compare_json_status=${PIPESTATUS[0]}
            set -e
            if [ "${compare_status}" -ne 0 ] || [ "${compare_json_status}" -ne 0 ]; then
              status=1
            fi
          fi
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload eval pack checklist artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-pack-checklists
          path: .skillbench/pack-checklists

      - name: Fail when eval pack validation failed
        if: steps.eval_pack_checklists.outputs.status != '0'
        run: exit 1
