name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e ".[dev,dashboard]"

      - name: Validate plugin manifest JSON
        run: python -m json.tool .codex-plugin/plugin.json > /dev/null

      - name: Compile runtime
        run: python -m compileall -q runtime

      - name: Run tests
        run: python -m pytest tests -q

      - name: Run SkillBench smoke evaluation
        run: |
          skillbench eval examples/skills/sample-skill/SKILL.md \
            --eval-set examples/eval_sets/basic-skill-eval.json \
            --output-dir .skillbench/runs
          skillbench benchmark \
            --fixtures examples/benchmarks/skills \
            --eval-set examples/benchmarks/eval_sets/skill-quality-benchmark.json \
            --output-dir .skillbench/benchmarks \
            --json
          skillbench export-dashboard .skillbench/runs/latest \
            --output .skillbench/dashboard-site
