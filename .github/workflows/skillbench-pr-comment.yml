name: SkillBench PR Comment

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  skillbench-comment:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e ".[dev,dashboard]"

      - name: Run SkillBench CI
        id: skillbench
        shell: bash
        run: |
          mkdir -p .skillbench/pr-comment
          set +e
          skillbench ci examples/skills/sample-skill/SKILL.md \
            --eval-set examples/eval_sets/basic-skill-eval.json \
            --output-dir .skillbench/pr-comment/runs \
            --min-score 8.0 \
            --min-safety 7.0 \
            --json | tee .skillbench/pr-comment/ci_result.json
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Build SkillBench PR comment
        shell: bash
        run: |
          skillbench pr-comment .skillbench/pr-comment/ci_result.json \
            --output .skillbench/pr-comment/skillbench-comment.md

      - name: Comment SkillBench summary
        uses: actions/github-script@v7
        env:
          SKILLBENCH_STATUS: ${{ steps.skillbench.outputs.status }}
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- skillbench-pr-comment -->";
            const body = fs.readFileSync(".skillbench/pr-comment/skillbench-comment.md", "utf8");

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.data.find((comment) => comment.user?.type === "Bot" && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail when SkillBench CI failed
        if: steps.skillbench.outputs.status != '0'
        run: exit 1
